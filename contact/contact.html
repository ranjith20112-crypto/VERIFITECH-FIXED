      :root {

html {
  scroll-behavior: smooth;
}

/* ============================================
   Z-INDEX FIXES - KEEP THESE AT TOP
   ============================================ */

/* Ensure navbar has proper z-index */
.navbar {
  z-index: 1050;
}

/* Fix dropdown z-index to appear above hero content */
.dropdown-menu {
  z-index: 1060;
  position: absolute;
}

/* Ensure dropdown items are clickable and visible */
.dropdown-item {
  position: relative;
  z-index: 1061;
}

/* Fix for hero section overlapping */
.industry-hero {
  position: relative;
  z-index: 1;
}

/* ============================================
   NAVBAR & NAVIGATION STYLES
   ============================================ */

.navbar {
  padding: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  height: 80px;
}

.navbar.scrolled {
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
}

/* Mobile navbar collapse background */
.navbar-collapse {
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  padding: 1rem;
  margin-top: 0.5rem;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
}

@media (min-width: 992px) {
  .navbar-collapse {
    background: transparent;
    backdrop-filter: none;
    padding: 0;
    margin-top: 0;
    box-shadow: none;
  }
}

.navbar-brand {
  font-weight: 800;
  font-size: 1.8rem;
  color: var(--dark);
  letter-spacing: -0.5px;
  display: flex;
  flex-direction: column;
  line-height: 1.1;
  transition: color 0.3s;
}

.navbar-brand img {
  height: 80px;
  width: 200px;
  object-fit: contain;
  display: block;
}

.navbar-brand span {
  color: var(--primary);
}

.brand-tagline {
  font-size: 0.65rem;
  font-weight: 500;
  color: var(--gray);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
}

.nav-link {
  font-weight: 600;
  color: var(--navy);
  margin: 0 0.6rem;
  position: relative;
  font-size: 0.9rem;
  transition: all 0.3s ease;
  padding: 2rem 0.5rem !important;
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-link:hover {
  color: var(--primary);
}

/* ============================================
   DROPDOWN MENU STYLES
   ============================================ */

.dropdown-menu {
  border: none;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
  border-radius: 12px;
  padding: 1rem;
  margin-top: 0.5rem;
  min-width: 280px;
  border-top: 3px solid var(--primary);
  transition: all 0.3s ease;
}

.dropdown-menu.mega-menu {
  min-width: 600px;
  padding: 1.5rem;
}

.dropdown-item {
  padding: 0.6rem 1rem;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--navy);
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 10px;
}

.dropdown-item:hover {
  background: var(--primary-light);
  color: var(--primary);
  transform: translateX(5px);
}

.dropdown-item i {
  font-size: 1.1rem;
  color: var(--primary);
  transition: color 0.3s;
}

.dropdown-header {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--primary);
  margin-bottom: 0.5rem;
  padding: 0.5rem 1rem;
}

.dropdown-divider {
  margin: 0.8rem 0;
  opacity: 0.1;
}

/* ============================================
   BUTTON STYLES
   ============================================ */

/* CTA Button - Talk to Sales */
.btn-sales {
  background: var(--primary);
  color: white !important;
  border: none;
  padding: 0.6rem 1.5rem;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.3s ease;
  white-space: nowrap;
  margin-left: 1rem;
  box-shadow: 0 4px 15px rgba(26, 194, 193, 0.3);
}

.btn-sales:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(26, 194, 193, 0.4);
}

/* Login Button */
.btn-login {
  background-color: #ffffff !important;
  color: #00bfa5 !important;
  border: 1px solid #00bfa5 !important;
  box-shadow: 0 2px 8px rgba(0, 191, 165, 0.3) !important;
  padding: 8px 24px;
  border-radius: 6px;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.3s ease;
  margin: 12px;
}

.btn-login:hover {
  background-color: #00bfa5 !important;
  color: #ffffff !important;
  box-shadow: 0 4px 12px rgba(0, 191, 165, 0.4) !important;
  transform: translateY(-1px);
}

/* ============================================
   COUNTRY SELECTOR - WHITE ARROW REMOVED
   ============================================ */

.country-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0.5rem;
  border-radius: 6px;
  border: 1px solid #e2e8f0;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy);
  cursor: pointer;
  transition: all 0.3s ease;
  margin-left: 1rem;
}

.country-selector:hover {
  border-color: var(--primary);
  color: var(--primary);
}

/* Remove Bootstrap's default white arrow from country selector */
.country-selector.dropdown-toggle::after {
  display: none !important;
  content: none !important;
  border: none !important;
}

/* Style the custom chevron icon */
.country-selector i.bi-chevron-down {
  font-size: 0.7rem;
  color: var(--navy);
  transition: transform 0.3s ease;
}

.country-selector:hover i.bi-chevron-down {
  color: var(--primary);
}

/* Rotate chevron when dropdown is open */
.country-selector[aria-expanded="true"] i.bi-chevron-down {
  transform: rotate(180deg);
}

.country-flag {
  font-size: 1.2rem;
  line-height: 1;
}

        .sales-hero h1 {
          font-size: 2.8rem;
        }

        .section-title {
          font-size: 2.2rem;
        }

        .demo-form {
          padding: 2rem;
        }

        .user-type-group {
          flex-direction: row;
        }
      }

      @media (max-width: 767px) {
        .sales-hero {
          padding: 120px 0 60px;
          text-align: center;
        }

        .sales-hero h1 {
          font-size: 2.2rem;
        }

        .contact-card-large {
          padding: 1.5rem;
        }

        .demo-form {
          padding: 1.5rem;
        }
        
        .user-type-group {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <!-- Second Contact Form Section - Quick Callback -->
    <section class="form-section" id="callback" style="background: linear-gradient(135deg, #f0fdfa 0%, #e0f7f7 50%, #ffffff 100%); padding: 60px 0;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 reveal">
            <div class="text-center mb-5">
              <div class="section-subtitle justify-content-center" style="margin: 0 auto; display: inline-flex;">
                <i class="bi bi-telephone-inbound"></i> Prefer a Call?
              </div>
              <h2 class="section-title">Request a Quick Callback</h2>
              <p class="section-desc mx-auto">
                Short on time? Leave your number and our sales team will call you back within 30 minutes during business hours.
              </p>
            </div>

            <div class="demo-form" style="background: white; border-radius: 24px; padding: 2.5rem; border: 2px solid var(--primary); box-shadow: 0 20px 60px rgba(26, 194, 193, 0.15);">
              <form id="callbackForm" onsubmit="return handleCallbackSubmit(event);">
                <div class="row g-4">
                  <!-- Name -->
                  <div class="col-md-6">
                    <label class="form-label" style="font-weight: 600; color: var(--dark); margin-bottom: 0.5rem; display: block;">
                      Your Name <span style="color: var(--primary);">*</span>
                    </label>
                    <div class="input-group" style="position: relative;">
                      <span class="input-group-text" style="background: var(--primary-light); border: 1px solid #e2e8f0; border-right: none; border-radius: 12px 0 0 12px; padding: 1rem; color: var(--primary);">
                        <i class="bi bi-person-fill"></i>
                      </span>
                      <input type="text" class="form-control" id="callbackName" required placeholder="John Doe" style="padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; border: 1px solid #e2e8f0; border-left: none; font-size: 1rem; transition: all 0.3s;">
                    </div>
                  </div>

                  <!-- Phone -->
                  <div class="col-md-6">
                    <label class="form-label" style="font-weight: 600; color: var(--dark); margin-bottom: 0.5rem; display: block;">
                      Phone Number <span style="color: var(--primary);">*</span>
                    </label>
                    <div class="input-group" style="position: relative;">
                      <span class="input-group-text" style="background: var(--primary-light); border: 1px solid #e2e8f0; border-right: none; border-radius: 12px 0 0 12px; padding: 1rem; color: var(--primary);">
                        <i class="bi bi-telephone-fill"></i>
                      </span>
                      <input type="tel" class="form-control" id="callbackPhone" required placeholder="+91 98765 43210" style="padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; border: 1px solid #e2e8f0; border-left: none; font-size: 1rem; transition: all 0.3s;">
                    </div>
                  </div>

                  <!-- Email (Optional) -->
                  <div class="col-md-6">
                    <label class="form-label" style="font-weight: 600; color: var(--dark); margin-bottom: 0.5rem; display: block;">
                      Email Address <span style="color: var(--gray); font-weight: 400;">(Optional)</span>
                    </label>
                    <div class="input-group" style="position: relative;">
                      <span class="input-group-text" style="background: var(--primary-light); border: 1px solid #e2e8f0; border-right: none; border-radius: 12px 0 0 12px; padding: 1rem; color: var(--primary);">
                        <i class="bi bi-envelope-fill"></i>
                      </span>
                      <input type="email" class="form-control" id="callbackEmail" placeholder="john@email.com" style="padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; border: 1px solid #e2e8f0; border-left: none; font-size: 1rem; transition: all 0.3s;">
                    </div>
                  </div>

                  <!-- Best Time to Call -->
                  <div class="col-md-6">
                    <label class="form-label" style="font-weight: 600; color: var(--dark); margin-bottom: 0.5rem; display: block;">
                      Best Time to Call <span style="color: var(--primary);">*</span>
                    </label>
                    <div class="input-group" style="position: relative;">
                      <span class="input-group-text" style="background: var(--primary-light); border: 1px solid #e2e8f0; border-right: none; border-radius: 12px 0 0 12px; padding: 1rem; color: var(--primary);">
                        <i class="bi bi-clock-fill"></i>
                      </span>
                      <select class="form-select" id="callbackTime" required style="padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; border: 1px solid #e2e8f0; border-left: none; font-size: 1rem; cursor: pointer; transition: all 0.3s;">
                        <option value="" selected disabled>Select a time slot...</option>
                        <option value="9-11">9:00 AM - 11:00 AM</option>
                        <option value="11-1">11:00 AM - 1:00 PM</option>
                        <option value="1-3">1:00 PM - 3:00 PM</option>
                        <option value="3-5">3:00 PM - 5:00 PM</option>
                        <option value="5-7">5:00 PM - 7:00 PM</option>
                      </select>
                    </div>
                  </div>

                  <!-- Purpose -->
                  <div class="col-12">
                    <label class="form-label" style="font-weight: 600; color: var(--dark); margin-bottom: 0.5rem; display: block;">
                      What would you like to discuss? <span style="color: var(--gray); font-weight: 400;">(Optional)</span>
                    </label>
                    <div class="input-group" style="position: relative;">
                      <span class="input-group-text" style="background: var(--primary-light); border: 1px solid #e2e8f0; border-right: none; border-radius: 12px 0 0 12px; padding: 1rem; color: var(--primary);">
                        <i class="bi bi-chat-left-text-fill"></i>
                      </span>
                      <select class="form-select" id="callbackPurpose" style="padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; border: 1px solid #e2e8f0; border-left: none; font-size: 1rem; cursor: pointer; transition: all 0.3s;">
                        <option value="" selected>General inquiry...</option>
                        <option value="pricing">Pricing & Plans</option>
                        <option value="demo">Product Demo</option>
                        <option value="integration">API Integration</option>
                        <option value="support">Technical Support</option>
                        <option value="partnership">Partnership Opportunity</option>
                      </select>
                    </div>
                  </div>
                </div>

                <!-- Privacy Checkbox -->
                <div class="form-check mt-4 mb-3" style="display: flex; align-items: flex-start; gap: 0.75rem;">
                  <input class="form-check-input" type="checkbox" id="callbackPrivacy" required style="width: 20px; height: 20px; margin: 0; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; flex-shrink: 0; margin-top: 2px;">
                  <label class="form-check-label" for="callbackPrivacy" style="color: var(--gray); font-size: 0.95rem; cursor: pointer; line-height: 1.5; margin: 0;">
                    I agree to receive a callback and accept the <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">Privacy Policy</a> <span style="color: var(--primary);">*</span>
                  </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn w-100" id="callbackSubmitBtn" style="background: var(--primary); color: white; border: none; padding: 1.1rem; border-radius: 12px; font-weight: 700; font-size: 1.1rem; transition: all 0.3s; box-shadow: 0 4px 15px rgba(26, 194, 193, 0.35); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                  <span class="btn-text">Request Callback</span>
                  <i class="bi bi-telephone-outbound"></i>
                </button>

                <!-- Trust Badges -->
                <div class="row mt-4 pt-4" style="border-top: 1px solid #e2e8f0;">
                  <div class="col-4 text-center">
                    <div style="color: var(--primary); font-size: 1.5rem; margin-bottom: 0.25rem;">
                      <i class="bi bi-shield-check"></i>
                    </div>
                    <small style="color: var(--gray); font-size: 0.75rem; font-weight: 600;">Secure</small>
                  </div>
                  <div class="col-4 text-center">
                    <div style="color: var(--primary); font-size: 1.5rem; margin-bottom: 0.25rem;">
                      <i class="bi bi-lightning-charge"></i>
                    </div>
                    <small style="color: var(--gray); font-size: 0.75rem; font-weight: 600;">30 Min Response</small>
                  </div>
                  <div class="col-4 text-center">
                    <div style="color: var(--primary); font-size: 1.5rem; margin-bottom: 0.25rem;">
                      <i class="bi bi-headset"></i>
                    </div>
                    <small style="color: var(--gray); font-size: 0.75rem; font-weight: 600;">Expert Support</small>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      // Navbar scroll effect
      window.addEventListener("scroll", () => {
        const navbar = document.querySelector(".navbar");
        if (window.scrollY > 50) {
          navbar.classList.add("scrolled");
        } else {
          navbar.classList.remove("scrolled");
        }
      });

      // Intersection Observer for animations
      const observerOptions = {
        threshold: 0.1,
        rootMargin: "0px 0px -50px 0px",
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("active");
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));

      // Smooth scroll
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute("href"));
          if (target) {
            const offsetTop = target.offsetTop - 100;
            window.scrollTo({
              top: offsetTop,
              behavior: "smooth",
            });
          }
        });
      });

      // Form switching functionality
      function switchForm(type) {
        const businessForm = document.getElementById('businessForm');
        const candidateForm = document.getElementById('candidateForm');
        
        if (type === 'business') {
          businessForm.style.display = 'block';
          candidateForm.style.display = 'none';
        } else {
          businessForm.style.display = 'none';
          candidateForm.style.display = 'block';
        }
      }

      // Show/Hide Loader
      function showLoader() {
        document.getElementById('formLoader').style.display = 'flex';
      }

      function hideLoader() {
        document.getElementById('formLoader').style.display = 'none';
      }

      // Get user's first name
      function getUserName(formType) {
        const fullName = document.getElementById(formType + '_SingleLine').value;
        return fullName.split(' ')[0] || 'there';
      }

      // Show Thank You Modal with user name
      function showThankYouModal(userName) {
        document.getElementById('userNameDisplay').textContent = userName;
        const modal = new bootstrap.Modal(document.getElementById('thankYouModal'));
        modal.show();
      }

      // Close Thank You Modal and reset form
      function closeThankYouModal() {
        const modal = bootstrap.Modal.getInstance(document.getElementById('thankYouModal'));
        modal.hide();
        
        // Reset both forms
        document.getElementById('businessFormElement').reset();
        document.getElementById('candidateFormElement').reset();
        
        // Switch back to business form
        switchForm('business');
        document.getElementById('business').checked = true;
      }

      // Validate form
      function validateForm(formType) {
        let isValid = true;
        const fields = formType === 'business' 
          ? ['SingleLine', 'Email', 'PhoneNumber', 'SingleLine1', 'Dropdown1']
          : ['SingleLine', 'Email', 'PhoneNumber', 'Dropdown1'];
        
        fields.forEach(field => {
          const input = document.getElementById(formType + '_' + field);
          const error = document.getElementById(field + (formType === 'candidate' ? '_candidate_error' : '_error'));
          
          if (!input.value || input.value === '') {
            if (error) error.style.display = 'block';
            isValid = false;
          } else {
            if (error) error.style.display = 'none';
          }
        });

        // Email validation
        const emailInput = document.getElementById(formType + '_Email');
        const emailError = document.getElementById('Email' + (formType === 'candidate' ? '_candidate_error' : '_error'));
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (emailInput.value && !emailRegex.test(emailInput.value)) {
          if (emailError) {
            emailError.textContent = 'Please enter a valid email address';
            emailError.style.display = 'block';
          }
          isValid = false;
        }

        // Privacy checkbox validation
        const privacyCheckbox = document.getElementById('privacy_' + formType);
        if (!privacyCheckbox.checked) {
          alert('Please agree to the Privacy Policy and Terms of Use');
          isValid = false;
        }

        return isValid;
      }

      // Handle form submission
      async function handleFormSubmit(event, formType) {
        event.preventDefault();
        
        // Validate form
        if (!validateForm(formType)) {
          return false;
        }

        // Get user name before submission
        const userName = getUserName(formType);

        // Show loader
        showLoader();

        const form = document.getElementById(formType + 'FormElement');
        const formData = new FormData(form);
        
        // Zoho form URLs
        const zohoUrl = formType === 'business'
          ? 'https://forms.zohopublic.in/verifitech/form/Contact11/formperma/9sK-SF3CwyblvIWCRgSvNK2NNjTYicXeIaw3s4zV1G8/htmlRecords/submit'
          : 'https://forms.zohopublic.in/verifitech/form/Candidate/formperma/nHl1gfzcIvm2GigdPys4YdODCjlOjHsKIIxc0uZO1-g/htmlRecords/submit';

        try {
          // Submit to Zoho using fetch with no-cors mode
          await fetch(zohoUrl, {
            method: 'POST',
            body: formData,
            mode: 'no-cors',
            headers: {
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
            }
          });

          // Hide loader
          hideLoader();

          // Show success modal with user's name
          showThankYouModal(userName);

        } catch (error) {
          console.error('Form submission error:', error);
          hideLoader();
          
          // Still show success (Zoho usually works despite CORS errors)
          showThankYouModal(userName);
        }

        return false;
      }

      // Real-time validation - hide error on input
      document.querySelectorAll('input, select, textarea').forEach(input => {
        input.addEventListener('input', function() {
          const errorId = this.id.replace(/^(business|candidate)_/, '') + '_error';
          const errorElement = document.getElementById(errorId) || 
                              document.getElementById(errorId.replace('_error', '_candidate_error'));
          if (errorElement) {
            errorElement.style.display = 'none';
          }
        });
      });
    </script>
  </body>
</html>
